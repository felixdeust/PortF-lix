<!DOCTYPE html>
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Mes projets</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <header class="border-b border-white/10 bg-slate-900/80">
        <div class="mx-auto flex max-w-6xl flex-col gap-5 px-6 py-6 sm:flex-row sm:items-center sm:justify-between">
            <a href="index.html" class="text-xl font-bold tracking-tight text-white">Mon portfolio<span class="text-violet-400">.</span></a>
            <nav aria-label="Navigation principale">
                <ul class="flex flex-wrap gap-x-6 gap-y-2 text-sm font-medium text-slate-300">
                    <li><a class="transition hover:text-violet-300" href="index.html">Accueil</a></li>
                    <li><a class="text-violet-300" aria-current="page" href="projets.html">Projets</a></li>
                    <li><a class="transition hover:text-violet-300" href="contact.html">Contact</a></li>
                    <li><a class="transition hover:text-violet-300" href="CV.html">CV</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="mx-auto max-w-6xl px-6 py-16 sm:py-20">
        <section id="projets" aria-labelledby="page-title">
            <div class="mb-12 max-w-2xl">
                <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-violet-400">Portfolio créatif</p>
                <h1 id="page-title" class="text-4xl font-black tracking-tight text-white sm:text-5xl">Mes projets</h1>
                <p class="mt-4 text-lg leading-8 text-slate-400">Découvrez une sélection de mes créations graphiques récentes.</p>
            </div>

            <div class="space-y-14">
                <section aria-labelledby="concert-title">
                    <div class="mb-5 flex items-center gap-4">
                        <h2 id="concert-title" class="text-2xl font-bold text-white">Ticket Concert</h2>
                        <span class="h-px flex-1 bg-white/10"></span>
                    </div>
                    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
                        <a class="block w-fit" href="images/SEEIFITHEREjaune.jpg" aria-label="Ouvrir le ticket de concert jaune en taille réelle"><img class="h-auto w-auto rounded-2xl border border-white/10 bg-slate-900 shadow-lg transition duration-300 hover:-translate-y-1 hover:shadow-violet-950/40" src="images/SEEIFITHEREjaune.jpg" alt="Ticket de concert, version jaune" loading="lazy"></a>
                        <a class="block w-fit" href="images/SEEIFITHERE.jpg" aria-label="Ouvrir le ticket de concert en taille réelle"><img class="h-auto w-auto rounded-2xl border border-white/10 bg-slate-900 shadow-lg transition duration-300 hover:-translate-y-1 hover:shadow-violet-950/40" src="images/SEEIFITHERE.jpg" alt="Ticket de concert" loading="lazy"></a>
                        <a class="block w-fit" href="images/SEEIFITHEREviloet.jpg" aria-label="Ouvrir le ticket de concert violet en taille réelle"><img class="h-auto w-auto rounded-2xl border border-white/10 bg-slate-900 shadow-lg transition duration-300 hover:-translate-y-1 hover:shadow-violet-950/40" src="images/SEEIFITHEREviloet.jpg" alt="Ticket de concert, version violette" loading="lazy"></a>
                    </div>
                </section>

                <section aria-labelledby="mockups-title">
                    <div class="mb-5 flex items-center gap-4">
                        <h2 id="mockups-title" class="text-2xl font-bold text-white">Mockups</h2>
                        <span class="h-px flex-1 bg-white/10"></span>
                    </div>
                    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
                        <a class="block w-fit" href="images/Sant.jpg" aria-label="Ouvrir le mockup de projet en taille réelle"><img class="h-auto w-auto rounded-2xl border border-white/10 bg-slate-900 shadow-lg transition duration-300 hover:-translate-y-1 hover:shadow-violet-950/40" src="images/Sant.jpg" alt="Mockup de projet" loading="lazy"></a>
                        <a class="block w-fit" href="images/SANTé.jpg" aria-label="Ouvrir le mockup santé en taille réelle"><img class="h-auto w-auto rounded-2xl border border-white/10 bg-slate-900 shadow-lg transition duration-300 hover:-translate-y-1 hover:shadow-violet-950/40" src="images/SANTé.jpg" alt="Mockup santé" loading="lazy"></a>
                        <a class="block w-fit" href="images/mockup vita care.jpg" aria-label="Ouvrir le mockup Vita Care en taille réelle"><img class="h-auto w-auto rounded-2xl border border-white/10 bg-slate-900 shadow-lg transition duration-300 hover:-translate-y-1 hover:shadow-violet-950/40" src="images/mockup vita care.jpg" alt="Mockup Vita Care" loading="lazy"></a>
                    </div>
                </section>

                <section aria-labelledby="affiches-title">
                    <div class="mb-5 flex items-center gap-4">
                        <h2 id="affiches-title" class="text-2xl font-bold text-white">Affiches</h2>
                        <span class="h-px flex-1 bg-white/10"></span>
                    </div>
                    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
                        <a class="block w-fit" href="images/whois.jpg" aria-label="Ouvrir l’affiche Who Is en taille réelle">
                            <img class="h-auto w-auto rounded-2xl border border-white/10 bg-slate-900 shadow-lg transition duration-300 hover:-translate-y-1 hover:shadow-violet-950/40" src="images/whois.jpg" alt="Affiche Who Is" loading="lazy">
                        </a>
                        <a class="block w-fit" href="images/skate.png" aria-label="Ouvrir l’affiche sur le skateboard en taille réelle">
                            <img class="h-auto w-auto rounded-2xl border border-white/10 bg-slate-900 shadow-lg transition duration-300 hover:-translate-y-1 hover:shadow-violet-950/40" src="images/skate.png" alt="Affiche sur le skateboard" loading="lazy">
                        </a>
                    </div>
                </section>
            </div>
        </section>
    </main>

    <footer class="border-t border-white/10 px-6 py-6 text-center text-sm text-slate-500">
        © 2025 Mon portfolio
    </footer>
</body>
</html>
